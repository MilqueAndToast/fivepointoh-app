name: five_zero
description: A shared character ledger for the 5.0 tabletop game.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/reference.json
    - assets/fonts/OFL.txt
  fonts:
    - family: LedgerSerif
      fonts:
        - asset: assets/fonts/LibreBaskerville.ttf
        - asset: assets/fonts/LibreBaskerville.ttf
          weight: 700
        - asset: assets/fonts/LibreBaskerville-Italic.ttf
          style: italic
